# ids3/projects/ptm/dev/app.yaml
# The store-backed mockups: demos/mockups/server.py, one container. The synthetic store is built at start into an
# emptyDir (about 1.3 s, background thread). Phase 2: the MIMIC-IV demo's store lives on the PVC ptm-mimic-demo
# (pvc.yaml), reused across restarts once verified.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ptm-mockups
  labels:
    app.kubernetes.io/name: ptm-mockups
spec:
  # One replica. Phase 2's RWO volume (pvc.yaml) makes this `Recreate`: a new pod on another node could not attach the
  # volume while the old one held it. A rollout therefore has a short gap (the synthetic store and the match worker
  # start in seconds, and the demo's store is reused from the volume); phase 1 rolled over without one.
  replicas: 1
  revisionHistoryLimit: 3
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: ptm-mockups
  template:
    metadata:
      labels:
        app: ptm-mockups
        app.kubernetes.io/name: ptm-mockups      # -> service.name in SigNoz
    spec:
      # The pod never calls the Kubernetes API. (VSO, if vault.yaml is ever added, authenticates with the namespace's
      # default service account by itself; it does not need the token mounted here.)
      automountServiceAccountToken: false
      enableServiceLinks: false
      # On a front-door node (the nodes Traefik runs on), so Traefik's connections and the kubelet's probes arrive from
      # the node addresses allow-traefik-ingress.yaml admits (security re-check of D50).
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - { key: ids.maastrichtu/front-door, operator: In, values: ["true"] }
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile: { type: RuntimeDefault }
      # imagePullSecrets:                        # not needed while the node mirrors ghcr.io through Harbor
      #   - name: ghcr-pull
      containers:
        - name: server
          # PINNED: a version tag AND its digest, never `latest`. Deploy a new build by a reviewed one-line change
          # here (hosting plan, "The image"). REPLACE both parts at the first publish.
          image: ghcr.io/maastrichtu-ids/patient-trajectory-matching/mockups:0.1.0@sha256:6595e73ea6c639b837bd316906886249fe3c8e65f53488932301e6920c08a7b4
          imagePullPolicy: IfNotPresent
          ports:
            - { containerPort: 8080, name: http }
          envFrom:
            - configMapRef: { name: ptm-mockups-config }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: [ALL] }
          volumeMounts:
            # the synthetic store's build, and the match worker's own copy (PTM_TRAJECTORY_STORE_ROOT)
            - { name: tmp, mountPath: /tmp }
            # the MIMIC-IV demo's store (phase 2): written only by the server's fetch-and-build, read by its store
            - { name: mimic-demo, mountPath: /var/lib/ptm-mimic-demo }
            - { name: datasets, mountPath: /etc/ptm, readOnly: true }
          # /api/health answers as soon as the socket is bound, during the store build too (checked by a test).
          # /api/ready answers 200 only once every configured dataset is ready, so a pod whose synthetic store fails
          # its content check never receives traffic, and a rollout stops there with the old pod still serving.
          startupProbe:
            httpGet: { path: /api/health, port: http }
            periodSeconds: 2
            failureThreshold: 30
          # Liveness by TCP connect: the kernel accepts it while the server's accept loop runs, whatever its request
          # threads are doing, so a flood of slow requests cannot get the pod restarted. Readiness stays HTTP and is
          # served from threads reserved beyond PTM_MAX_THREADS for the probes.
          livenessProbe:
            tcpSocket: { port: http }
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            httpGet: { path: /api/ready, port: http }
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          # Measured: about 180 MB peak RSS for the server with its store, plus about 145 MiB for each of the two match
          # workers (the active one and its spare, match_worker.py). Re-measure on the cluster after the first deploy.
          # Each match worker opens DuckDB with one worker thread and one async thread (match_worker.confine_duckdb),
          # so its address space does not grow with the CPUs: measured in a Linux container at about 145 MiB resident
          # and 268 MiB of address space at one, four and six CPUs, inside its 400 MiB limit (PTM_MATCH_WORKER_MAX_MIB).
          # Phase 2: when the volume holds no verified store, the MIMIC-IV demo's store is built in a child process
          # (mimic_demo_fetch.py) at the lowest CPU priority: 858 MiB peak resident in a Linux container, address
          # space limited to 1,600 MiB (BUILD_MAX_MIB). Once it is open, two MIMIC match workers (active and spare,
          # match_worker.IsolatedStoreQuery) serve its matches: 386 MiB resident each, limited to 700 MiB
          # (PTM_STORE_WORKER_MAX_MIB). The build ends before they start, so the peak is about 1.3 GiB either way:
          # the hosting plan, "The phase 2 security review", has the arithmetic.
          resources:
            requests: { cpu: 100m, memory: 512Mi }
            limits: { cpu: "1", memory: 2Gi }
      volumes:
        - name: tmp
          emptyDir: { sizeLimit: 512Mi }
        - name: mimic-demo
          persistentVolumeClaim: { claimName: ptm-mimic-demo }
        - name: datasets
          configMap: { name: ptm-mockups-datasets }
      terminationGracePeriodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: ptm-mockups
  labels:
    app.kubernetes.io/name: ptm-mockups
spec:
  selector:
    app: ptm-mockups
  ports:
    - { name: http, port: 8080, targetPort: http }
