# ids3/projects/ptm/dev/kustomization.yaml (DRAFT in patient-trajectory-matching: deploy/ids3/ptm/dev/)
# project=ptm env=dev -> namespace ptm-dev (created by the projects ApplicationSet).
# _base adds the restrict-egress NetworkPolicy; allow-keycloak-egress.yaml unions the one cross-namespace exception
# this app needs (JWKS from platform/keycloak); allow-traefik-ingress.yaml admits only Traefik to the pod.
# middleware.yaml holds the Traefik rate limits, body limit and HSTS the two Ingresses name; ingress-match.yaml puts
# the match routes under a tighter rate limit. No PVC, no database, no migration.
#
# vault.yaml is deliberately NOT listed: ptm-dev has no secret today (README, "Secrets"). Add it here, with the
# Vault steps in README.md, when the first secret arrives.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../_base
  - allow-keycloak-egress.yaml
  - allow-traefik-ingress.yaml
  - configmap.yaml
  - app.yaml
  - middleware.yaml
  - ingress.yaml
  - ingress-match.yaml
