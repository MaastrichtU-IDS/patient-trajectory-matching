# ids3/projects/ptm/dev/kustomization.yaml (DRAFT in patient-trajectory-matching: deploy/ids3/ptm/dev/)
# project=ptm env=dev -> namespace ptm-dev (created by the projects ApplicationSet).
# PHASE 2 DRAFT (not deployed): sign-in through the realm `ids-apps`, and the MIMIC-IV demo for approved users.
# Phase 1 (live since 2026-11-23) is this file without allow-keycloak-egress.yaml.
# _base adds the restrict-egress NetworkPolicy; allow-keycloak-egress.yaml unions the one cross-namespace exception
# (the realm's keys from platform/keycloak); allow-traefik-ingress.yaml admits only Traefik to the pod. The MIMIC-IV
# demo is fetched from physionet.org through the egress-proxy, which restrict-egress already allows.
# middleware.yaml holds the Traefik rate limits, body limit and HSTS the two Ingresses name; ingress-match.yaml puts
# the match routes under a tighter rate limit. pvc.yaml holds the MIMIC-IV demo's built store; no database, no
# migration.
#
# vault.yaml stays unlisted: phase 2 still has no secret (the browser client is public, the realm's keys are
# public, the demo is open data).
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../_base
  - allow-keycloak-egress.yaml
  - allow-traefik-ingress.yaml
  - configmap.yaml
  - pvc.yaml
  - app.yaml
  - middleware.yaml
  - ingress.yaml
  - ingress-match.yaml
