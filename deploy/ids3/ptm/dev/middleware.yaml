# ids3/projects/ptm/dev/middleware.yaml
# Traefik Middlewares named by ingress.yaml and ingress-match.yaml: per-client rate limits, a request body limit and
# HSTS, at the front door, before a request reaches the pod. The server keeps its own bounds behind them
# (PTM_MAX_BODY, PTM_MATCH_CONCURRENCY, PTM_MAX_THREADS in configmap.yaml, a 30 s socket timeout, caps on patients,
# events, steps and relations), so a request that slips past the front door is still bounded.
#
# The client is the connection's source address: Traefik is the front door on the host network since 2026-09-24,
# so there is no proxy in front whose X-Forwarded-For would have to be trusted. The admin confirms this
# (hosting plan, section 4); if a proxy is ever put in front, set sourceCriterion.ipStrategy.depth.
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: ptm-ratelimit
spec:
  rateLimit:
    # A page load fetches about 20 static files and the 6 MB synthetic cohort. These numbers leave a person
    # browsing untouched and stop a loop. 429 beyond them.
    average: 20
    period: 1s
    burst: 60
---
# The match routes only (ingress-match.yaml): each match is real CPU work, so a client gets about one a second,
# with a burst of five for a person trying a few queries in a row (security review of D50, M1).
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: ptm-match-ratelimit
spec:
  rateLimit:
    average: 1
    period: 1s
    burst: 5
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: ptm-body-limit
spec:
  buffering:
    # Matches PTM_MAX_BODY. Hosted, the only bodies are the pages' store requests: a query and a window per patient,
    # a few kilobytes. Larger bodies get 413 from Traefik without reaching the pod. Responses are not size-limited
    # (0 = no maximum): the cohort file the pages download is 6 MB.
    maxRequestBodyBytes: 262144
    memRequestBodyBytes: 262144
    maxResponseBodyBytes: 0
---
# HSTS: browsers that have seen the site over HTTPS refuse plain HTTP to it for a year. Not includeSubDomains or
# preload: the wildcard domain holds other projects' hosts, which this project does not decide for.
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: ptm-hsts
spec:
  headers:
    stsSeconds: 31536000
    stsIncludeSubdomains: false
    stsPreload: false
