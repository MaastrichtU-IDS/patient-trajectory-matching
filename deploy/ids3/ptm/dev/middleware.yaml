# ids3/projects/ptm/dev/middleware.yaml
# Traefik Middlewares named by ingress.yaml: a per-client rate limit and a request body limit, at the front door,
# before a request reaches the pod. The server keeps its own limits behind them (PTM_MAX_BODY,
# PTM_MATCH_CONCURRENCY in configmap.yaml), so a misrouted request is still bounded.
#
# The client is the connection's source address: Traefik is the front door on the host network since 2026-09-24,
# so there is no proxy in front whose X-Forwarded-For would have to be trusted. The admin confirms this
# (hosting plan, section 4); if a proxy is ever put in front, set sourceCriterion.ipStrategy.depth.
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: ptm-ratelimit
spec:
  rateLimit:
    # A page load fetches about 20 static files and the 6 MB synthetic cohort; a match is one POST. These numbers
    # leave a person browsing untouched and stop a loop. 429 beyond them.
    average: 20
    period: 1s
    burst: 60
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: ptm-body-limit
spec:
  buffering:
    # Matches PTM_MAX_BODY. The pages' requests are a few kilobytes to a few hundred (hosting plan, section 4);
    # larger bodies get 413 from Traefik without reaching the pod. Responses are not size-limited (0 = no maximum):
    # the cohort file the pages download is 6 MB.
    maxRequestBodyBytes: 2097152
    memRequestBodyBytes: 262144
    maxResponseBodyBytes: 0
