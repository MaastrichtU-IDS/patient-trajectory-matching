# DRAFT, not applied. Cloud Run service for option (b) of docs/hosting-plan.md.
# Apply only by the owner, after the image exists:
#   gcloud run services replace deploy/cloudrun/service.mockups.yaml --region us-central1 --project dumontier-charm
# Replace REPLACE_WITH_IMAGE_DIGEST; the image is the one built from Dockerfile.mockups.
# No secret is mounted and no MIMIC variable is set. Invocation is IAM-gated (the default);
# nothing here grants allUsers.
apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: ptm-mockups
  labels:
    app: ptm-mockups
  annotations:
    run.googleapis.com/ingress: all
spec:
  template:
    metadata:
      annotations:
        autoscaling.knative.dev/minScale: "0"     # "1" removes the cold start, at idle cost
        autoscaling.knative.dev/maxScale: "2"     # a cost and abuse cap; the pages hold no shared state
        run.googleapis.com/startup-cpu-boost: "true"
    spec:
      containerConcurrency: 20
      timeoutSeconds: 60
      containers:
        - image: us-central1-docker.pkg.dev/dumontier-charm/ptm/ptm-mockups@sha256:REPLACE_WITH_IMAGE_DIGEST
          ports:
            - containerPort: 8080
          resources:
            limits:
              cpu: "1"
              memory: 1Gi
          startupProbe:
            httpGet:
              path: /api/health
            periodSeconds: 2
            failureThreshold: 15
