name: contracts

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  profile:
    name: PRO/SOLID profile and oracle (Python 3.12)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          # The pack is authored and tested against CPython 3.12.
          python-version: '3.12'
          cache: pip
          cache-dependency-path: patterns/requirements.lock.txt

      - name: Install pinned dependencies
        run: python -m pip install -r patterns/requirements.lock.txt

      - name: Verify release manifest hashes
        run: python .github/scripts/check_manifest.py

      - name: Reference oracle (16 cases, 7 property checks)
        run: python reference_oracle.py

      - name: Pipeline from synthetic source rows
        run: python -m patterns.pro_solid

      - name: Regenerated graph matches committed example
        run: python .github/scripts/check_graph.py

      - name: Pipeline from committed RDF graph
        run: python -m patterns.pro_solid --graph examples/pro-solid/graph.ttl

      - name: Acceptance suite (42 profile tests)
        run: python -m patterns.test_pro_solid

      - name: Exact interval pipeline
        run: python -m patterns.exact_intervals

      - name: Exact interval conformance and RDF round trip
        run: python -m patterns.test_exact_intervals

      - name: Exact interval cohort example
        run: python -m patterns.interval_cohort

      - name: Cohort contract and differential search checks
        run: python -m patterns.test_interval_cohort

      - name: Bounded uncertainty example
        run: python -m patterns.bounded_cohort

      - name: Bounded uncertainty finite-world and certificate checks
        run: python -m patterns.test_bounded_intervals

      - name: Bounded RDF ingestion example
        run: python -m patterns.bounded_rdf

      - name: Bounded RDF validation and source equivalence
        run: python -m patterns.test_bounded_rdf

      - name: Evidence selection example
        run: python -m patterns.evidence_selection

      - name: Evidence lifecycle and matcher integration
        run: python -m patterns.test_evidence_selection

      - name: Report generated-file drift
        # Informational only. Report files record the runner's Python patch
        # version, so they are expected to differ from the committed release.
        if: always()
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            echo "::notice::generated files changed during this run:"
            git status --porcelain
            git diff -- verification | head -60
          else
            echo "no generated-file drift"
          fi

      - name: Upload run outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verification-output
          path: verification/
          retention-days: 14

  oracle-compatibility:
    name: Oracle on Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The README claims the dependency-free oracle runs on 3.10 or newer.
        python-version: ['3.10', '3.11', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Reference oracle, no third-party dependencies
        run: python reference_oracle.py
