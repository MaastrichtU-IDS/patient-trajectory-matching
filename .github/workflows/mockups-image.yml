# The mockups image for the ids3 cluster (docs/hosting-plan.md, D50). Activated 2026-11-23 for phase 1 (the owner's
# approval: image public; synthetic-only demo, no sign-in).
#
# Builds deploy/ids3/mockups.Dockerfile with buildx (so the allow-list beside it applies), starts the image read-only
# and checks it: health during the build, readiness, the anonymous dataset list, no MIMIC store configured, no MIMIC
# file or variable in the image, the engine route off and no Python source served. On a pull request touching the
# image's inputs it does only that. Only for a tag `mockups-vX.Y.Z` does a second job, the only one allowed to write
# packages, push those same checked bits as `X.Y.Z` (never `latest`) and print the digest for the services-repo PR.
#
# Hardening (security review of D50, L7): every action pinned by commit SHA, each checked on 2026-11-23 against the
# release named beside it (`gh api repos/<action>/git/ref/tags/<tag>`, annotated tags dereferenced); the tag reaches
# shell only through `env:` and is validated against ^[0-9]+\.[0-9]+\.[0-9]+$ before use; `packages: write` only on
# the publish job.
name: mockups image

on:
  push:
    tags: ['mockups-v*']
  pull_request:        # build and check only, when the image's inputs change
    paths:
      - .github/workflows/mockups-image.yml
      - deploy/ids3/**
      - demos/mockups/**
      - patterns/**
      - schemas/**
      - ontology/**
  workflow_dispatch:   # build and check without publishing

permissions:
  contents: read

env:
  IMAGE: ghcr.io/maastrichtu-ids/patient-trajectory-matching/mockups

jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069  # v4.4.1
      - name: Version from the tag, validated
        id: version
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          if [ "$REF_TYPE" = tag ]; then
            version="${REF_NAME#mockups-v}"
            if ! printf '%s' "$version" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
              echo "tag must be mockups-vX.Y.Z" >&2; exit 1
            fi
          else
            version=check
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Build (loaded locally, saved for the publish job)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc  # v7.4.0
        with:
          context: .
          file: deploy/ids3/mockups.Dockerfile
          load: true
          tags: ${{ env.IMAGE }}:${{ steps.version.outputs.version }}
      - name: Start it read-only, as hosted, and check it
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          ref="$IMAGE:$VERSION"
          docker run -d --name m --read-only --tmpfs /tmp:size=512m -p 8080:8080 "$ref"
          for i in $(seq 1 30); do curl -fsS localhost:8080/api/health && break; sleep 1; done
          for i in $(seq 1 60); do curl -fsS localhost:8080/api/ready && break; sleep 1; done
          curl -fsS localhost:8080/api/datasets | python3 -c "import json,sys; d=json.load(sys.stdin); assert [x['id'] for x in d['datasets']]==['synthetic-paediatric-rare'], d; assert not d['caller']['owner'], d"
          curl -fsS localhost:8080/api/store/status | python3 -c "import json,sys; d=json.load(sys.stdin); assert d['available'] is False, d"
          test "$(curl -s -o /dev/null -w '%{http_code}' -X POST -H 'Content-Type: application/json' -d '{}' localhost:8080/api/trajectory-graph/match)" = 404
          test "$(curl -s -o /dev/null -w '%{http_code}' localhost:8080/server.py)" = 404
          curl -fsSI localhost:8080/ | grep -qi '^content-security-policy:'
          curl -fsS localhost:8080/api/limits | python3 -c "import json,sys; d=json.load(sys.stdin); assert d['hosted'] and d['search_budget']==1000 and d['match_time_limit_s']==2, d"
          test -z "$(docker exec m sh -c 'find / -xdev \( -iname "*mimic*" -a \( -name "*.duckdb" -o -name "*.parquet" -o -name "*.csv.gz" \) \) 2>/dev/null')"
          test -z "$(docker exec m env | grep -i '^PTM_MIMIC' || true)"
          docker rm -f m
          docker save "$ref" -o image.tar
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        if: github.ref_type == 'tag'
        with:
          name: mockups-image
          path: image.tar
          retention-days: 1

  publish:
    if: github.ref_type == 'tag'
    needs: check
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: mockups-image
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550  # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Push the checked image and print its digest
        env:
          VERSION: ${{ needs.check.outputs.version }}
        run: |
          printf '%s' "$VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'
          docker load -i image.tar
          docker push "$IMAGE:$VERSION"
          docker inspect --format '{{index .RepoDigests 0}}' "$IMAGE:$VERSION"
