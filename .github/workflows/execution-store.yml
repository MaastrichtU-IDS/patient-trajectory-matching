name: execution store
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r patterns/requirements.lock.txt -r patterns/requirements-store.lock.txt
      - run: python -m unittest -v patterns.test_execution_store
      - run: python -m unittest patterns.test_trajectory_graph
      - run: python -m unittest -v patterns.test_mimic_store_ingest
      - run: python -m unittest -v patterns.test_mimic_chartevents patterns.test_prepared_reference patterns.test_merkle_patients
      - run: python -m unittest -v tools.test_benchmark_execution_store
      - run: python -m unittest -v tools.test_benchmark_matcher
