name: interface mockups

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  mockups:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: demos/mockups/requirements-hosting.lock.txt
      - name: Install the mockup server's pinned hosting dependencies (DuckDB; PyJWT and cryptography for the token check)
        run: python -m pip install -r demos/mockups/requirements-hosting.lock.txt
      - name: Generate the synthetic cohort and confirm a second run reproduces it
        run: |
          python demos/mockups/synthetic/generate.py
          python demos/mockups/synthetic/generate.py --check
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Parse every page script
        run: |
          for script in demos/mockups/shared/core.js demos/mockups/shared/auth.js demos/mockups/shared/limits.js demos/mockups/patient-first/app.js demos/mockups/trajectory/app.js demos/mockups/store-query/app.js; do
            node --check "$script"
          done
      - name: Mockup server serves the pages, the engine, the store endpoints and per-dataset access (tokens checked locally)
        run: python -m unittest discover -s demos/mockups -p 'test_*.py'
      - name: The trajectory page agrees with the engine on every patient
        run: node demos/mockups/test_engine_parity.cjs
      - name: The trajectory page and the execution store agree, or differ by a named cause
        run: node demos/mockups/test_store_parity.cjs
      - name: The pages' sign-in (PKCE, tokens in memory and the tab's storage), with the browser stubbed
        run: node demos/mockups/test_auth_page.cjs
