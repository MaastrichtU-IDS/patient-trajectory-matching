name: regenerate linux-only reports

# Three verification reports measure peak resident memory across a process tree by
# reading /proc, so they cannot be produced on macOS: `demo/profile_pressure_workload.py`
# refuses with LINUX_PROC_REQUIRED, and the two evaluators raise outright. Until now they
# were regenerated by hand on a Linux host, which meant that changing any module they bind
# left the provenance gate red with no route to green from a developer machine.
#
# Deliberately manual. It downloads the open-access MIMIC-IV demo release and runs a
# memory benchmark for several minutes, neither of which belongs on every push. Dispatch
# it against the branch whose reports need refreshing, download the `regenerated-reports`
# artifact and commit the three files.
#
# The four source files are the pinned open-access demo, never credentialed MIMIC. Their
# checksums are verified against data/clinical-source-demo-pin.json before any of them is
# read, and a mismatch stops the run: a report produced from unpinned sources would be
# indistinguishable from one produced from the pinned release.

on:
  workflow_dispatch:
    inputs:
      repetitions:
        description: 'Workload repetitions for the memory profile'
        default: '3'
      timeout_seconds:
        description: 'Wall-time limit for the memory profile'
        default: '3600'

permissions:
  contents: read

jobs:
  regenerate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            patterns/requirements.lock.txt
            patterns/requirements-semantic.lock.txt
      - name: Install pinned graph and Rust dependencies
        run: python -m pip install -r patterns/requirements-semantic.lock.txt

      - name: Confirm the runner provides the /proc interface these reports measure
        run: |
          test "$(uname -s)" = Linux
          test -f /proc/self/stat
          echo "page size: $(getconf PAGE_SIZE)"

      - name: Fetch the pinned open-access MIMIC-IV demo files
        run: |
          mkdir -p /tmp/mimic-demo
          for name in inputevents icustays d_items chartevents; do
            curl --fail --silent --show-error --location \
              -o "/tmp/mimic-demo/$name.csv.gz" \
              "https://physionet.org/files/mimic-iv-demo/2.2/icu/$name.csv.gz"
          done

      - name: Verify every file against the repository pin before reading it
        run: |
          python - <<'PY'
          import hashlib, json, pathlib, sys
          pin = json.loads(pathlib.Path('data/clinical-source-demo-pin.json').read_text())
          folder = pathlib.Path('/tmp/mimic-demo')
          bad = []
          for name, meta in pin['files'].items():
              digest = hashlib.sha256((folder / f'{name}.csv.gz').read_bytes()).hexdigest()
              ok = digest == meta['file_sha256']
              print(f'{name:14} {"match" if ok else "MISMATCH"} {digest}')
              if not ok:
                  bad.append(name)
          sys.exit(f'unpinned source files: {bad}' if bad else 0)
          PY

      # Each writes its report only on success. A failed run prints the failure and exits
      # non-zero without publishing, so a red step never leaves a stub to be committed.
      - name: Integrated recorded evaluation
        run: |
          python -m tools.evaluate_integrated_recorded \
            --mimic-dir /tmp/mimic-demo \
            --output verification/integrated-recorded-evaluation.json

      - name: Recorded workflow evaluation
        run: |
          python -m tools.evaluate_recorded_workflow \
            --mimic-dir /tmp/mimic-demo \
            --output verification/recorded-workflow-evaluation.json

      - name: Configured workload memory profile
        run: |
          python demo/profile_pressure_workload.py \
            --config examples/configured-pressure-service/config.json \
            --workload examples/configured-pressure-service/workload.json \
            --repetitions '${{ inputs.repetitions }}' \
            --interval 0.02 \
            --timeout '${{ inputs.timeout_seconds }}' \
            --output verification/pressure-workload-memory-report.json

      - name: Refuse to publish a report that records its own failure
        run: python tools/check_report_provenance.py

      - name: Show what changed
        run: git --no-pager diff --stat -- verification/

      - uses: actions/upload-artifact@v4
        with:
          name: regenerated-reports
          path: |
            verification/integrated-recorded-evaluation.json
            verification/recorded-workflow-evaluation.json
            verification/pressure-workload-memory-report.json
          if-no-files-found: error
