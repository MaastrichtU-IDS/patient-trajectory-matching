name: presentation demo

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  demo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            patterns/requirements.lock.txt
            patterns/requirements-semantic.lock.txt
      - name: Install pinned graph and Rust dependencies
        run: python -m pip install -r patterns/requirements-semantic.lock.txt
      - name: Verify demo routes, live pipelines, replay and failure diagnostics
        run: python -m unittest discover -s demo -p 'test_*.py'
      - name: Verify guided JavaScript states and failure handling
        run: |
          node demo/test_guided_ui.cjs
          node demo/test_pressure_ui.cjs
      - name: Upload mapped pressure HTTP verification
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mapped-pressure-http-evidence
          path: verification/mapped-pressure-run/report.json
          retention-days: 14
